name: Atualizar Cardápio

on:
  schedule:
    - cron: "0 15 * * 1"

  workflow_dispatch:

jobs:
  update-menu:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: |
          playwright install --with-deps chromium

      - name: Executar ETL
        env:
          CEFSA_USUARIO: ${{ secrets.CEFSA_USUARIO }}
          CEFSA_SENHA: ${{ secrets.CEFSA_SENHA }}
        run: |
          python jobs/update_menu.py

      - name: Commitar cardápio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add database/json_repository.json

          git diff --cached --quiet || git commit -m "chore: atualizar cardápio"

          git push